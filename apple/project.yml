name: ReceptionCounter
options:
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 沖縄ビジネスITフェス受付カウンター
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
    PRODUCT_MODULE_NAME: ReceptionCounter
    CODE_SIGN_STYLE: Automatic
targets:
  ReceptionCounter-iOS:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: 沖縄ビジネスITフェス受付カウンター
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.keyplanning.okinawaitfes.counter.ios
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
  ReceptionCounter-macOS:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_NAME: 沖縄ビジネスITフェス受付カウンター
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.keyplanning.okinawaitfes.counter.macos
        ENABLE_APP_SANDBOX: YES
  ReceptionCounterTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: ReceptionCounter-macOS
    settings:
      base:
        PRODUCT_MODULE_NAME: ReceptionCounterTests
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.keyplanning.okinawaitfes.counter.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/沖縄ビジネスITフェス受付カウンター.app/Contents/MacOS/沖縄ビジネスITフェス受付カウンター"
schemes:
  ReceptionCounter-iOS:
    build:
      targets:
        ReceptionCounter-iOS: all
  ReceptionCounter-macOS:
    build:
      targets:
        ReceptionCounter-macOS: all
    test:
      targets: [ReceptionCounterTests]
